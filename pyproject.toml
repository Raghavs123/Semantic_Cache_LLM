[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "semantic-faq-cache"
version = "1.0.0"
description = "A semantic cache in front of an LLM FAQ bot, with a measured hit rate, false-hit count and latency."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Your Name" }]
keywords = ["llm", "semantic-cache", "embeddings", "faq-bot", "rag", "fastapi"]
dependencies = [
  "numpy>=2.0",
  "sentence-transformers>=5.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
faiss = ["faiss-cpu>=1.9"]
redis = ["redisvl>=0.4"]
anthropic = ["anthropic>=0.70"]
openai = ["openai>=1.50"]
gemini = ["google-genai>=1.0"]
ollama = ["httpx>=0.27"]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
faqcache = "faqcache.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/faqcache"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
